allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// FIX flutter plugin install_plugin for Flutter 3.24
subprojects {
    afterEvaluate { project ->
        if (project.group == "com.example.installplugin") {
            project.android {
                compileSdkVersion = 36
                namespace = project.group
                compileOptions {
                    sourceCompatibility = JavaVersion.VERSION_11
                    targetCompatibility = JavaVersion.VERSION_11
                }
                kotlinOptions {
                    jvmTarget = JavaVersion.VERSION_11
                }
            }
        }

        // The upstream API AAR ships its Android service as bytecode and its
        // native libraries together. Enhanced keeps the native libraries but
        // builds the service adapter from source so the upstream API identity
        // can remain stable under our independent application signature.
        if (project.group == "com.ghosten.api") {
            project.android.sourceSets.main.java.srcDirs +=
                    rootProject.file("compat/api/src/main/kotlin")

            def downloadApiDependencies = project.tasks.named("downloadDependencies")
            downloadApiDependencies.configure {
                doLast {
                    delete project.file("${project.buildDir}/output/classes.jar")
                }
            }

            project.tasks.configureEach { task ->
                if (task.name.startsWith("compile") && task.name.endsWith("Kotlin")) {
                    task.dependsOn(downloadApiDependencies)
                }
            }
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
